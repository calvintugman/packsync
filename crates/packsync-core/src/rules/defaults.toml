# PackSync built-in default rules (format version 1).
#
# Semantics
#   * Patterns are globs anchored at the *instance root* (`**` crosses directories, `*` does not).
#   * `$GAME` expands to the game directory relative to the instance root (`.minecraft`,
#     `minecraft`, or nothing for a plain game folder).
#   * For every path the LAST matching rule wins; paths matching no rule follow `unmatched`.
#   * Credentials/secrets are excluded by a separate hard-coded layer that no rule can override.
#   * `strategy` / `compress` only apply to included files. `prune = true` lets the scanner skip an
#     excluded directory entirely (unless a later include rule could match below it).
#
# These rules are copied into every snapshot, so all devices of an instance always agree on what
# is synced, whatever app version they run. Edit the rules of an instance, not this file.

version = 1
unmatched = "exclude"

# --------------------------------------------------------------------------- worlds
[[rule]]
id = "worlds"
match = ["$GAME/saves/**"]
action = "include"
category = "world"
reason = "Single-player worlds: terrain, player data, modded dimensions, per-world mod data and quest progress."

[[rule]]
id = "world-locks"
match = ["$GAME/saves/**/session.lock", "$GAME/saves/**/*.lock"]
action = "exclude"
category = "lock"
reason = "Lock files held by a running game; machine- and session-specific."

[[rule]]
id = "world-temp"
match = ["$GAME/saves/**/*.tmp", "$GAME/saves/**/*.temp"]
action = "exclude"
category = "temp"
reason = "Temporary files."
case_insensitive = true

# --------------------------------------------------------------------------- the pack itself
[[rule]]
id = "mods"
match = ["$GAME/mods/**", "$GAME/coremods/**"]
action = "include"
category = "mods"
reason = "The exact installed mod binaries (kept in your private storage so the pack can always be rebuilt)."

[[rule]]
id = "pack-config"
match = [
  "$GAME/config/**",
  "$GAME/defaultconfigs/**",
  "$GAME/configureddefaults/**",
  "$GAME/scripts/**",
  "$GAME/kubejs/**",
  "$GAME/groovy/**",
  "$GAME/crafttweaker/**",
  "$GAME/openloader/**",
  "$GAME/global_packs/**",
  "$GAME/datapacks/**",
  "$GAME/resourcepacks/**",
  "$GAME/resources/**",
  "$GAME/structures/**",
  "$GAME/patchouli_books/**",
]
action = "include"
category = "config"
reason = "Pack configuration, scripts, custom recipes, datapacks and resource packs."

# --------------------------------------------------------------------------- player progression outside the world folder
[[rule]]
id = "player-content"
match = ["$GAME/schematics/**", "$GAME/blueprints/**", "$GAME/visualprospecting/**", "$GAME/XaeroWaypoints/**"]
action = "include"
category = "progress"
reason = "Player-made schematics/blueprints, ore-vein prospecting data and waypoints."

[[rule]]
id = "journeymap-waypoints"
match = ["$GAME/journeymap/data/*/*/waypoints/**"]
action = "include"
category = "progress"
reason = "JourneyMap waypoints. Map tile caches are excluded (large, regenerated by exploring)."

[[rule]]
id = "voxelmap-waypoints"
match = ["$GAME/voxelmap/*.points"]
action = "include"
category = "progress"
reason = "Minimap waypoints."

[[rule]]
id = "client-state"
match = ["$GAME/servers.dat", "$GAME/hotbar.nbt", "$GAME/emi.json"]
action = "include"
category = "settings"
reason = "Server list, saved hotbars and EMI favourites."

[[rule]]
id = "options"
match = ["$GAME/options.txt"]
action = "include"
category = "settings"
reason = "Keybinds, language and gameplay options. Graphics/window/device keys stay local (see mixed policy)."
mixed = "minecraft.options_txt"

# --------------------------------------------------------------------------- device-specific settings stay local
[[rule]]
id = "local-graphics-configs"
match = [
  "$GAME/optionsof.txt",
  "$GAME/optionsshaders.txt",
  "$GAME/config/sodium-options.json",
  "$GAME/config/sodium-extra-options.json",
  "$GAME/config/embeddium-options.json",
  "$GAME/config/embeddium-extra.properties",
  "$GAME/config/rubidium-options.json",
  "$GAME/config/rubidium-extra.properties",
  "$GAME/config/iris.properties",
  "$GAME/config/oculus.properties",
  "$GAME/config/optifine/**",
  "$GAME/config/dynamic_fps.json",
  "$GAME/config/dynamic_fps.toml",
]
action = "exclude"
category = "machine"
reason = "Graphics/performance settings tuned for one computer's GPU and display."

# --------------------------------------------------------------------------- never synced: regenerable, large or machine-specific
[[rule]]
id = "logs"
match = ["$GAME/logs/**", "$GAME/*.log", "$GAME/hs_err_pid*.log"]
action = "exclude"
category = "log"
reason = "Logs."
prune = true

[[rule]]
id = "crash-reports"
match = ["$GAME/crash-reports/**"]
action = "exclude"
category = "crash"
reason = "Crash reports are kept locally; they are diagnostics, not game state."
prune = true

[[rule]]
id = "caches"
match = [
  "$GAME/.cache/**",
  "$GAME/cache/**",
  "$GAME/.fabric/**",
  "$GAME/.mixin.out/**",
  "$GAME/.bobby/**",
  "$GAME/downloads/**",
  "$GAME/webcache*/**",
  "$GAME/modernfix/**",
  "$GAME/journeymap/data/*/*/DIM*/**",
  "$GAME/XaeroWorldMap/**",
  "$GAME/Distant_Horizons_server_data/**",
  "$GAME/distanthorizons/**",
  # Distant Horizons' level-of-detail database inside a world (1.2 GB in a GregTech: New Horizons world,
  # partly rewritten every session): regenerated from the world's chunks
  "$GAME/saves/**/DistantHorizons.sqlite*",
  "$GAME/debug/**",
]
action = "exclude"
category = "cache"
reason = "Caches and data the game regenerates (map tiles, remapped jars, LOD databases). Add an include rule to keep a specific one."
prune = true

[[rule]]
id = "backups"
match = ["$GAME/backups/**", "$GAME/ftbbackups*/**", "$GAME/simplebackups/**", "$GAME/saves/*.zip", "$GAME/backup/**"]
action = "exclude"
category = "backup"
reason = "Redundant backups made by other tools; PackSync keeps its own history."
prune = true

[[rule]]
id = "screenshots"
match = ["$GAME/screenshots/**"]
action = "exclude"
category = "screenshot"
reason = "Screenshots are opt-in (large, rarely needed on another computer)."
prune = true

[[rule]]
id = "shaders"
match = ["$GAME/shaderpacks/**"]
action = "exclude"
category = "shader"
reason = "Shader packs are GPU-specific and bulky; opt in with an include rule."
prune = true

[[rule]]
id = "natives"
match = ["natives/**", "$GAME/natives/**", "$GAME/bin/**"]
action = "exclude"
category = "native"
reason = "Native libraries are extracted by the launcher for the local OS; another OS's binaries must not be restored."
prune = true

[[rule]]
id = "native-binaries"
match = ["**/*.dll", "**/*.so", "**/*.so.*", "**/*.dylib", "**/*.jnilib", "**/*.exe"]
action = "exclude"
category = "native"
reason = "Platform-specific native code is resolved locally, never copied from another OS."
case_insensitive = true

[[rule]]
id = "launcher-managed"
match = ["$GAME/versions/**", "$GAME/assets/**", "$GAME/runtime/**", "$GAME/libraries/**"]
action = "exclude"
category = "launcher-managed"
reason = "Downloaded and verified by the launcher itself."
prune = true

[[rule]]
id = "usercache"
match = ["$GAME/usercache.json", "$GAME/usernamecache.json", "$GAME/realms_persistence.json"]
action = "exclude"
category = "machine"
reason = "Local account/name caches."

[[rule]]
id = "temp-files"
match = ["**/*.tmp", "**/*.temp", "**/*.swp", "**/*~"]
action = "exclude"
category = "temp"
reason = "Temporary and editor files."
case_insensitive = true
