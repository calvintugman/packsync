[package]
name = "packsync-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Provider- and UI-independent sync engine for Minecraft modpack instances"

[lints]
workspace = true

[features]
default = []
# Deterministic crash/fault injection points (compiled out unless enabled).
failpoints = []
# Test helpers (storage conformance suite, fixture generators, multi-device harness) for use by
# other crates' tests and the benchmark tool.
testkit = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
time.workspace = true
blake3.workspace = true
zstd.workspace = true
fastcdc.workspace = true
rusqlite.workspace = true
globset.workspace = true
walkdir.workspace = true
rayon.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
fs4.workspace = true
filetime.workspace = true
file-id.workspace = true
unicode-normalization.workspace = true
sysinfo.workspace = true
notify.workspace = true
tracing.workspace = true
fastrand.workspace = true
dunce.workspace = true
hex.workspace = true
md-5.workspace = true
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
