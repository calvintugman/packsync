[package]
name = "packsync-prism"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Prism Launcher adapter for PackSync: instance discovery, hooks, restore registration and launching"

[lints]
workspace = true

[dependencies]
packsync-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tracing.workspace = true
uuid.workspace = true
unicode-normalization.workspace = true
dunce.workspace = true
time.workspace = true

[dev-dependencies]
# the crate's own tests use its testkit, which builds on core's fixtures
packsync-core = { workspace = true, features = ["testkit"] }
tempfile.workspace = true
toml.workspace = true
fastrand.workspace = true

[features]
# Fixtures for tests of code that uses this adapter (Prism-shaped instances, a fake `prismlauncher`).
testkit = ["packsync-core/testkit"]
