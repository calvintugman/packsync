[package]
name = "packsync-s3"
description = "PackSync storage provider for S3-compatible object stores (Cloudflare R2, MinIO, AWS S3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# In-process S3 server for tests and benchmarks (checks every request's signature).
mock = ["dep:tiny_http"]

[dependencies]
packsync-core.workspace = true
ureq.workspace = true
md-5.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
hex.workspace = true
time.workspace = true
httpdate.workspace = true
parking_lot.workspace = true
tracing.workspace = true
uuid.workspace = true
tiny_http = { workspace = true, optional = true }

[dev-dependencies]
packsync-core = { workspace = true, features = ["testkit"] }
packsync-s3 = { path = ".", features = ["mock"] }
tempfile.workspace = true
